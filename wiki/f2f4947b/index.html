span class="keyword">from</span> kafka.protocol.offset <span class="keyword">import</span> OffsetRequest_v0, OffsetResponse_v0</span><br><span class="line"></span><br><span class="line"><span class="comment">#from monitor_constants import *</span></span><br><span class="line"></span><br><span class="line">duration = <span class="number">0</span></span><br><span class="line">client = <span class="literal">None</span></span><br><span class="line">conn = <span class="literal">None</span></span><br><span class="line">partition_cache = &#123;&#125;</span><br><span class="line">brokers_cache = []</span><br><span class="line">kafka_type = [<span class="string">&#x27;heimdallr&#x27;</span>]</span><br><span class="line">zk_type = []</span><br><span class="line"></span><br><span class="line"></span><br><span class="line"><span class="keyword">def</span> <span class="title function_">get_brokers</span>():</span><br><span class="line">    <span class="keyword">if</span> <span class="keyword">not</span> brokers_cache:</span><br><span class="line">        brokers = client.cluster.brokers()</span><br><span class="line">        <span class="keyword">if</span> brokers:</span><br><span class="line">            brokers_cache.extend([x.nodeId <span class="keyword">for</span> x <span class="keyword">in</span> brokers])</span><br><span class="line">    <span class="keyword">return</span> brokers_cache</span><br><span class="line"></span><br><span class="line"></span><br><span class="line"><span class="keyword">def</span> <span class="title function_">get_partitions</span>(<span class="params">topic</span>):</span><br><span class="line">    <span class="keyword">if</span> <span class="keyword">not</span> partition_cache <span class="keyword">or</span> topic <span class="keyword">not</span> <span class="keyword">in</span> partition_cache:</span><br><span class="line">        partitions = client.cluster.available_partitions_for_topic(topic)</span><br><span class="line">        <span class="keyword">if</span> partitions:</span><br><span class="line">            partition_cache[topic] = [x <span class="keyword">for</span> x <span class="keyword">in</span> partitions]</span><br><span class="line">        <span class="keyword">else</span>:</span><br><span class="line">            <span class="keyword">return</span> []</span><br><span class="line">    <span class="keyword">return</span> partition_cache[topic]</span><br><span class="line"></span><br><span class="line"></span><br><span class="line"><span class="keyword">def</span> <span class="title function_">get_logsize</span>():</span><br><span class="line">    <span class="string">&quot;&quot;&quot;</span></span><br><span class="line"><span class="string">        获取topic 下每个partition的logsize(各个broker的累加)</span></span><br><span class="line"><span class="string">    :return:</span></span><br><span class="line"><span class="string">    &quot;&quot;&quot;</span></span><br><span class="line">    tp = &#123;&#125;  <span class="comment"># topic : partition_dict</span></span><br><span class="line">    brokers = get_brokers()</span><br><span class="line">    <span class="keyword">for</span> topic <span class="keyword">in</span> topics:</span><br><span class="line">        partitions = get_partitions(topic)</span><br><span class="line">        pl = &#123;&#125;  <span class="comment"># partition : logsize</span></span><br><span class="line">        <span class="keyword">for</span> broker <span class="keyword">in</span> brokers:</span><br><span class="line">            <span class="comment"># 这里取笛卡尔积可能有问题,但是不影响parse中解析了</span></span><br><span class="line">            <span class="keyword">for</span> partition <span class="keyword">in</span> partitions:</span><br><span class="line">                client.send(broker, OffsetRequest_v0(replica_id=-<span class="number">1</span>, topics=[(topic, [(partition, -<span class="number">1</span>, <span class="number">1</span>)])]))</span><br><span class="line">                responses = client.poll()</span><br><span class="line">                pdict = parse_logsize(topic, partition, responses)</span><br><span class="line">                append(pl, pdict)</span><br><span class="line">        tp[topic] = pl</span><br><span class="line">    <span class="keyword">return</span> tp</span><br><span class="line"></span><br><span class="line"></span><br><span class="line"><span class="keyword">def</span> <span class="title function_">append</span>(<span class="params">rdict, pdict</span>):</span><br><span class="line">    <span class="keyword">if</span> rdict:</span><br><span class="line">        <span class="comment"># 已经有记录,累加</span></span><br><span class="line">        <span class="keyword">for</span> k, v <span class="keyword">in</span> pdict.items():</span><br><span class="line">            <span class="keyword">if</span> k <span class="keyword">in</span> rdict:</span><br><span class="line">                rdict[k] = rdict[k] + v</span><br><span class="line">            <span class="keyword">else</span>:</span><br><span class="line">                rdict[k] = v</span><br><span class="line">    <span class="keyword">else</span>:</span><br><span class="line">        rdict.update(pdict)</span><br><span class="line"></span><br><span class="line"></span><br><span class="line"><span class="keyword">def</span> <span class="title function_">parse_logsize</span>(<span class="params">t, p, responses</span>):</span><br><span class="line">    <span class="string">&quot;&quot;&quot;</span></span><br><span class="line"><span class="string">        单个broker中单个partition的logsize</span></span><br><span class="line"><span class="string">    :param responses:</span></span><br><span class="line"><span class="string">    :param p:</span></span><br><span class="line"><span class="string">    :param t:</span></span><br><span class="line"><span class="string">    :return:</span></span><br><span class="line"><span class="string">    &quot;&quot;&quot;</span></span><br><span class="line">    <span class="keyword">for</span> response <span class="keyword">in</span> responses:</span><br><span class="line">        <span class="keyword">if</span> <span class="keyword">not</span> <span class="built_in">isinstance</span>(response, OffsetResponse_v0):</span><br><span class="line">            <span class="keyword">return</span> &#123;&#125;</span><br><span class="line">        tps = response.topics</span><br><span class="line">        topic = tps[<span class="number">0</span>][<span class="number">0</span>]</span><br><span class="line">        partition_list = tps[<span class="number">0</span>][<span class="number">1</span>]</span><br><span class="line">        partition = partition_list[<span class="number">0</span>][<span class="number">0</span>]</span><br><span class="line">        <span class="comment"># 异步poll来的数据可能不准</span></span><br><span class="line">        <span class="keyword">if</span> topic == t <span class="keyword">and</span> partition == p <span class="keyword">and</span> partition_list[<span class="number">0</span>][<span class="number">1</span>] == <span class="number">0</span>:</span><br><span class="line">            logsize_list = partition_list[<span class="number">0</span>][<span class="number">2</span>]</span><br><span class="line">            logsize = logsize_list[<span class="number">0</span>]</span><br><span class="line">            <span class="keyword">return</span> &#123;partition: logsize&#125;</span><br><span class="line">    <span class="keyword">return</span> &#123;&#125;</span><br><span class="line"></span><br><span class="line"></span><br><span class="line"><span class="keyword">def</span> <span class="title function_">parse_offsets</span>(<span class="params">t, responses</span>):</span><br><span class="line">    dr = &#123;&#125;</span><br><span class="line">    <span class="keyword">for</span> response <span class="keyword">in</span> responses:</span><br><span class="line">        <span class="keyword">if</span> <span class="keyword">not</span> <span class="built_in">isinstance</span>(response, (OffsetFetchResponse_v1, OffsetFetchResponse_v0)):</span><br><span class="line">            <span class="keyword">return</span> &#123;&#125;</span><br><span class="line">        tps = response.topics</span><br><span class="line">        topic = tps[<span class="number">0</span>][<span class="number">0</span>]</span><br><span class="line">        partition_list = tps[<span class="number">0</span>][<span class="number">1</span>]</span><br><span class="line">        <span class="keyword">if</span> topic == t:</span><br><span class="line">            <span class="keyword">for</span> partition_tunple <span class="keyword">in</span> partition_list:</span><br><span class="line">                <span class="keyword">if</span> partition_tunple[<span class="number">3</span>] == <span class="number">0</span>:</span><br><span class="line">                    offset = partition_tunple[<span class="number">1</span>]</span><br><span class="line">                    dr[partition_tunple[<span class="number">0</span>]] = offset</span><br><span class="line">    <span class="keyword">return</span> dr</span><br><span class="line"></span><br><span class="line"></span><br><span class="line"><span class="keyword">def</span> <span class="title function_">get_offsets</span>():</span><br><span class="line">    <span class="comment"># &#123;gid: dict&#125;</span></span><br><span class="line">    gd = &#123;&#125;</span><br><span class="line">    <span class="keyword">for</span> gid <span class="keyword">in</span> monitor_group_ids:</span><br><span class="line">        td = &#123;&#125;  <span class="comment"># &#123;topic:dict&#125;</span></span><br><span class="line">        <span class="keyword">for</span> topic <span class="keyword">in</span> topics:</span><br><span class="line">            pd = &#123;&#125;  <span class="comment"># &#123;partition:dict&#125;</span></span><br><span class="line">            <span class="keyword">for</span> broker <span class="keyword">in</span> get_brokers():</span><br><span class="line">                partitions = get_partitions(topic)</span><br><span class="line">                <span class="keyword">if</span> <span class="keyword">not</span> partitions:</span><br><span class="line">                    <span class="keyword">return</span> &#123;&#125;</span><br><span class="line">                <span class="keyword">else</span>:</span><br><span class="line">                    responses = optionnal_send(broker, gid, topic, partitions)</span><br><span class="line">                    dr = parse_offsets(topic, responses)</span><br><span class="line">                    append(pd, dr)</span><br><span class="line">            td[topic] = pd</span><br><span class="line">        gd[gid] = td</span><br><span class="line">    <span class="keyword">return</span> gd</span><br><span class="line"></span><br><span class="line"></span><br><span class="line"><span class="keyword">def</span> <span class="title function_">optionnal_send</span>(<span class="params">broker, gid, topic, partitions</span>):</span><br><span class="line">    <span class="keyword">if</span> gid <span class="keyword">in</span> kafka_type:</span><br><span class="line">        <span class="keyword">return</span> kafka_send(broker, gid, topic, partitions)</span><br><span class="line">    <span class="keyword">elif</span> gid <span class="keyword">in</span> zk_type:</span><br><span class="line">        <span class="keyword">return</span> zk_send(broker, gid, topic, partitions)</span><br><span class="line">    <span class="keyword">else</span>:</span><br><span class="line">        responses = zk_send(broker, gid, topic, partitions)</span><br><span class="line">        dct = parse_offsets(topic, responses)</span><br><span class="line">        <span class="keyword">if</span> is_suitable(dct):</span><br><span class="line">            zk_type.append(gid)</span><br><span class="line">            <span class="keyword">return</span> responses</span><br><span class="line">        responses = kafka_send(broker, gid, topic, partitions)</span><br><span class="line">        dct = parse_offsets(topic, responses)</span><br><span class="line">        <span class="keyword">if</span> is_suitable(dct):</span><br><span class="line">            kafka_type.append(gid)</span><br><span class="line">        <span class="keyword">return</span> responses</span><br><span class="line"></span><br><span class="line"></span><br><span class="line"><span class="keyword">def</span> <span class="title function_">is_suitable</span>(<span class="params">dct</span>):</span><br><span class="line">    <span class="keyword">for</span> x <span class="keyword">in</span> dct.values():</span><br><span class="line">        <span class="keyword">if</span> x != -<span class="number">1</span>:</span><br><span class="line">            <span class="keyword">return</span> <span class="literal">True</span></span><br><span class="line"></span><br><span class="line"></span><br><span class="line"><span class="keyword">def</span> <span class="title function_">kafka_send</span>(<span class="params">broker, gid, topic, partitions</span>):</span><br><span class="line">    client.send(broker, OffsetFetchRequest_v1(consumer_group=gid, topics=[(topic, partitions)]))</span><br><span class="line">    <span class="keyword">return</span> client.poll()</span><br><span class="line"></span><br><span class="line"></span><br><span class="line"><span class="keyword">def</span> <span class="title function_">zk_send</span>(<span class="params">broker, gid, topic, partitions</span>):</span><br><span class="line">    client.send(broker, OffsetFetchRequest_v0(consumer_group=gid, topics=[(topic, partitions)]))</span><br><span class="line">    <span class="keyword">return</span> client.poll()</span><br><span class="line"></span><br><span class="line"><span class="keyword">def</span> <span class="title function_">do_task</span>():</span><br><span class="line">    offset_dict = get_offsets()</span><br><span class="line">    <span class="comment">#print (offset_dict)</span></span><br><span class="line">    logsize_dict = get_logsize()</span><br><span class="line">    <span class="comment">#print (logsize_dict)</span></span><br><span class="line">    <span class="built_in">print</span> (<span class="string">&#x27;----------kafka monitor, info:-------------&#x27;</span>)</span><br><span class="line">    <span class="keyword">for</span> gk, gv <span class="keyword">in</span> offset_dict.items():</span><br><span class="line">        <span class="keyword">for</span> tk, tv <span class="keyword">in</span> gv.items():</span><br><span class="line">            <span class="keyword">for</span> pk, pv <span class="keyword">in</span> tv.items():</span><br><span class="line">                <span class="keyword">if</span> logsize_dict <span class="keyword">and</span> tk <span class="keyword">in</span> logsize_dict:</span><br><span class="line">                    dr = logsize_dict[tk]  <span class="comment"># partition:logsize</span></span><br><span class="line">                    <span class="keyword">if</span> dr <span class="keyword">and</span> pk <span class="keyword">in</span> dr:</span><br><span class="line">                        param = (gk, tk, pk, pv, dr[pk],</span><br><span class="line">                                 time.strftime(<span class="string">&#x27;%Y-%m-%d %H:%M:%S&#x27;</span>, time.localtime(time.time())))</span><br><span class="line">                        <span class="built_in">print</span>(param)</span><br><span class="line"></span><br><span class="line"></span><br><span class="line"><span class="keyword">if</span> __name__ == <span class="string">&quot;__main__&quot;</span>:</span><br><span class="line">    client = KafkaClient(bootstrap_servers=servers, request_timeout_ms=<span class="number">3000</span>)</span><br><span class="line">    <span class="keyword">while</span> <span class="literal">True</span>:</span><br><span class="line">        do_task()</span><br><span class="line">        time.sleep(time_interval)</span><br><span class="line">        duration += time_interval</span><br></pre></td></tr></table></figure>

    <script>
    function hexToRgb(hex) {
      if (!hex) return null;
      hex = hex.replace('#', '');
      let r = parseInt(hex.slice(0, 2), 16);
      let g = parseInt(hex.slice(2, 4), 16);
      let b = parseInt(hex.slice(4, 6), 16);
      return { r, g, b };
    }
    function adjustColor(color, adjustment) {
        if (!color) return null;
      let { r, g, b } = hexToRgb(color);
      r = Math.min(255, Math.max(0, r + adjustment));
      g = Math.min(255, Math.max(0, g + adjustment));
      b = Math.min(255, Math.max(0, b + adjustment));
      return `rgb(${r}, ${g}, ${b})`;
    }
    const BackColors = ['#FFFFFF', '#F0FFF0', '#FFFFF0'];
    let ColorIndex = 0;
    function changeBackgroundColor(newColor) {
        $('.outer, .widget-wrap h3, body, .article-inner, .article-inner .article-meta').css('background-color', newColor);
        $('.article-entry blockquote').css('background-color', adjustColor(newColor, -10)).css('border-left','4px solid #c8c8c8');
    }
    $(document).ready(function() {
        changeBackgroundColor(BackColors[ColorIndex]);
    });
    </script>

<script>
    // anchorInterceptor
    anchorInterceptor = function(path) {
        // 添加 fullpage=1 参数表示整页打开
        const separator = path.includes('?') ? '&' : '?';
        const fullPath = path + separator + 'fullpage=1';
        // change hash to trigger route change
        window.location.hash = fullPath;
    }

    document.addEventListener('DOMContentLoaded', function() {
        var container = document.getElementById('container');
        
        // 检查URL中是否有 fullpage=1 参数
        var urlParams = new URLSearchParams(window.location.search);
        var isFullPage = urlParams.get('fullpage') === '1';
        
        // 如果有 container（完整布局）或者 fullpage=1，执行跳转
        if (container || isFullPage) {
            var path = window.location.pathname;
            var origin = window.location.origin;
            console.log('path:',path, '\norigin:',origin);
            console.log('document:', document);
            // 如果已经在 hash 路由中，不需要跳转
            if (window.location.hash) {
                return;
            }
            // 如果path是根路径，跳转到首页hash
            if (path === '/' || path === '' || path === '/index.html') {
                window.location.href = origin + '#/';
            } else {
                window.location.href = origin + '#' + path;
            }
        }
        // 否则不跳转，需要加载js、css来渲染单页面
    });

    // 切换到单页模式
    switchToSinglePage = function() {
        // 获取当前文章路径（从hash中提取或从pathname）
        var path = window.location.hash ? window.location.hash.slice(1) : window.location.pathname;
        // 移除fullpage参数
        path = path.replace(/[?&]fullpage=1/, '');
        // 在新标签页打开完整URL
        window.open(window.location.origin + path, '_blank');
    }

    $(document).ready(function() {
        if ($('#toggle-sidebar-btn').hasClass('fa-angle-right')) {

            $('.article-more-link').toggleClass('collapsed');
        }
        const colorIndex = localStorage.getItem("ColorIndex");
        // init color
        changeBackgroundColor(BackColors[colorIndex]);
    });

    anchorComponentOnclick = function(event) {

        $('.article-category-link').on('click', function(event) {

            const idx = decodeURIComponent($(this).attr('href')).slice(1);
