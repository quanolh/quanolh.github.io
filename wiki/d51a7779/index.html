        // 检查内容是否可见且有实际内容（超过100字符）
        var hasContent = articleEntry.innerHTML.length > 100;
        var isVisible = articleEntry.offsetParent !== null;
        
        return hasContent && isVisible;
    }
    
    // 根据解密状态显示/隐藏 TOC
    function updateTocVisibility() {
        if (checkDecrypted()) {
            toc.style.display = 'block';
        } else {
            toc.style.display = 'none';
        }
    }
    
    // 初始检查
    updateTocVisibility();
    
    // 监听点击事件（解密/加密按钮）
    document.addEventListener('click', function() {
        // 延迟检查，等待解密/加密操作完成
        setTimeout(updateTocVisibility, 100);
        setTimeout(updateTocVisibility, 500);
    });
    
    // 提供全局函数供外部调用
    window.showEncryptedToc = function() {
        toc.style.display = 'block';
    };
    window.hideEncryptedToc = function() {
        toc.style.display = 'none';
    };
})();
</script>

    <script>
    function hexToRgb(hex) {
      if (!hex) return null;
      hex = hex.replace('#', '');
      let r = parseInt(hex.slice(0, 2), 16);
      let g = parseInt(hex.slice(2, 4), 16);
      let b = parseInt(hex.slice(4, 6), 16);
      return { r, g, b };
    }
    function adjustColor(color, adjustment) {
        if (!color) return null;
      let { r, g, b } = hexToRgb(color);
      r = Math.min(255, Math.max(0, r + adjustment));
      g = Math.min(255, Math.max(0, g + adjustment));
      b = Math.min(255, Math.max(0, b + adjustment));
      return `rgb(${r}, ${g}, ${b})`;
    }
    const BackColors = ['#FFFFFF', '#F0FFF0', '#FFFFF0'];
    let ColorIndex = 0;
    function changeBackgroundColor(newColor) {
        $('.outer, .widget-wrap h3, body, .article-inner, .article-inner .article-meta').css('background-color', newColor);
        $('.article-entry blockquote').css('background-color', adjustColor(newColor, -10)).css('border-left','4px solid #c8c8c8');
    }
    $(document).ready(function() {
        changeBackgroundColor(BackColors[ColorIndex]);
    });
    </script>

<script>
    // anchorInterceptor
    anchorInterceptor = function(path) {
        // 添加 fullpage=1 参数表示整页打开
        const separator = path.includes('?') ? '&' : '?';
        const fullPath = path + separator + 'fullpage=1';
        // change hash to trigger route change
        window.location.hash = fullPath;
    }

    document.addEventListener('DOMContentLoaded', function() {
        var container = document.getElementById('container');
        
        // 检查URL中是否有 fullpage=1 参数
        var urlParams = new URLSearchParams(window.location.search);
        var isFullPage = urlParams.get('fullpage') === '1';
        
        // 如果有 container（完整布局）或者 fullpage=1，执行跳转
        if (container || isFullPage) {
            var path = window.location.pathname;
            var origin = window.location.origin;
            console.log('path:',path, '\norigin:',origin);
            console.log('document:', document);
            // 如果已经在 hash 路由中，不需要跳转
            if (window.location.hash) {
                return;
            }
            // 如果path是根路径，跳转到首页hash
            if (path === '/' || path === '' || path === '/index.html') {
                window.location.href = origin + '#/';
            } else {
                window.location.href = origin + '#' + path;
            }
        }
        // 否则不跳转，需要加载js、css来渲染单页面
    });

    // 切换到单页模式
    switchToSinglePage = function() {
        // 获取当前文章路径（从hash中提取或从pathname）
        var path = window.location.hash ? window.location.hash.slice(1) : window.location.pathname;
        // 移除fullpage参数
        path = path.replace(/[?&]fullpage=1/, '');
        // 在新标签页打开完整URL
        window.open(window.location.origin + path, '_blank');
    }

    $(document).ready(function() {
        if ($('#toggle-sidebar-btn').hasClass('fa-angle-right')) {
            $('.page-indent').toggleClass('collapsed');
            $('.article-meta').toggleClass('collapsed');
            $('.article-more-link').toggleClass('collapsed');
        }
        const colorIndex = localStorage.getItem("ColorIndex");
        // init color
        changeBackgroundColor(BackColors[colorIndex]);
    });

    anchorComponentOnclick = function(event) {
        // 文章的头链接 | 点击监听
        $('.article-category-link').on('click', function(event) {
            event.preventDefault();
            const path = $(this).attr('href');
            anchorInterceptor(path);
        });
        // 目录的跳转 | 点击监听
        $('.toc-link').on('click', function(event) {
            event.preventDefault();
            const params = new URLSearchParams(window.location.search);
            //const sectionId = $(this).attr('href').replace('?section=', '');
            // 更新 URL，但不刷新页面
            const idx = decodeURIComponent($(this).attr('href')).slice(1);
            if (idx != 'ndefined') {
                params.set('section', idx);
                const curPath = window.location.pathname + window.location.hash.split('?section=')[0];
                const newUrl = curPath + '?' + params.toString();
                window.history.pushState({}, '', newUrl);
                // 滚动到对应位置
                scrollToSection(idx);
            }
        });
        $('.tag-link-link').on('click', function(event) {
            event.preventDefault();
            const path = $(this).attr('href');
            anchorInterceptor(path);
        });
        $('#page-nav').on('click', 'a', function(event) {
            event.preventDefault();
            const path = $(this).attr('href');
            anchorInterceptor(path);
        });
    }
</script>
