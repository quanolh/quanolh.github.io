            <ul>

<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br></pre></td><td class="code"><pre><span class="line">mapping = &#123;</span><br><span class="line">        &#x27;settings&#x27;: &#123;</span><br><span class="line">            &#x27;index&#x27;: &#123;</span><br><span class="line">                &#x27;number_of_replicas&#x27;: 1,</span><br><span class="line">                &#x27;number_of_shards&#x27;: 6,</span><br><span class="line">                &#x27;refresh_interval&#x27;: &#x27;5s&#x27;</span><br><span class="line">            &#125;</span><br><span class="line">        &#125;,</span><br><span class="line">        &#x27;mappings&#x27;: &#123;</span><br><span class="line">            &#x27;_default_&#x27;: &#123;</span><br><span class="line">                &#x27;_all&#x27;: &#123;</span><br><span class="line">                    &#x27;enabled&#x27;: False</span><br><span class="line">                &#125;</span><br><span class="line">            &#125;,</span><br><span class="line">            doc_type : &#123;</span><br><span class="line">                &#x27;properties&#x27; : &#123;</span><br><span class="line">                    &#x27;day&#x27;: &#123; &#x27;type&#x27;: &#x27;string&#x27;, &#x27;index&#x27;: &#x27;not_analyzed&#x27;&#125;,</span><br><span class="line">                    &#x27;time&#x27;: &#123; &#x27;type&#x27;: &#x27;string&#x27;, &#x27;index&#x27;: &#x27;not_analyzed&#x27;&#125;,</span><br><span class="line">                    &#x27;nanoTime&#x27;: &#123; &#x27;type&#x27;: &#x27;string&#x27;, &#x27;index&#x27;: &#x27;not_analyzed&#x27;&#125;,</span><br><span class="line">                    &#x27;created&#x27;: &#123; &#x27;type&#x27;: &#x27;date&#x27;, &#x27;index&#x27;: &#x27;not_analyzed&#x27;&#125;,</span><br><span class="line">                    &#x27;app&#x27;: &#123; &#x27;type&#x27;: &#x27;string&#x27;, &#x27;index&#x27;: &#x27;not_analyzed&#x27;&#125;,</span><br><span class="line">                    &#x27;host&#x27;: &#123; &#x27;type&#x27;: &#x27;string&#x27;, &#x27;index&#x27;: &#x27;not_analyzed&#x27;&#125;,</span><br><span class="line">                    &#x27;thread&#x27;: &#123; &#x27;type&#x27;: &#x27;string&#x27;, &#x27;index&#x27;: &#x27;not_analyzed&#x27;&#125;,</span><br><span class="line">                    &#x27;level&#x27;: &#123; &#x27;type&#x27;: &#x27;string&#x27;, &#x27;index&#x27;: &#x27;not_analyzed&#x27;&#125;,</span><br><span class="line">                    &#x27;eventType&#x27;: &#123; &#x27;type&#x27;: &#x27;string&#x27;, &#x27;index&#x27;: &#x27;not_analyzed&#x27;&#125;,</span><br><span class="line">                    &#x27;pack&#x27;: &#123; &#x27;type&#x27;: &#x27;string&#x27;, &#x27;index&#x27;: &#x27;not_analyzed&#x27;&#125;,</span><br><span class="line">                    &#x27;clazz&#x27;: &#123; &#x27;type&#x27;: &#x27;string&#x27;, &#x27;index&#x27;: &#x27;not_analyzed&#x27;&#125;,</span><br><span class="line">                    &#x27;line&#x27;: &#123; &#x27;type&#x27;: &#x27;string&#x27;, &#x27;index&#x27;: &#x27;not_analyzed&#x27;&#125;,</span><br><span class="line">                    &#x27;messageSmart&#x27;: &#123; &#x27;type&#x27;: &#x27;text&#x27;, &#x27;analyzer&#x27;: &#x27;ik_smart&#x27;, &#x27;search_analyzer&#x27;: &#x27;ik_smart&#x27;, &#x27;include_in_all&#x27;: &#x27;true&#x27;, &#x27;boost&#x27;: 8&#125;,</span><br><span class="line">                    &#x27;messageMax&#x27;: &#123; &#x27;type&#x27;: &#x27;text&#x27;, &#x27;analyzer&#x27;: &#x27;ik_max_word&#x27;, &#x27;search_analyzer&#x27;: &#x27;ik_max_word&#x27;, &#x27;include_in_all&#x27;: &#x27;true&#x27;, &#x27;boost&#x27;: 8&#125;</span><br><span class="line">                &#125;</span><br><span class="line">            &#125;</span><br><span class="line">        &#125;</span><br><span class="line">    &#125;</span><br></pre></td></tr></table></figure>

<!-- TOC 收起/展开功能 -->
<script data-pjax>
(function() {
    // 初始化 TOC 切换功能的函数
    function initTocToggle() {
        var tocWrapper = document.getElementById('toc-wrapper');
        var tocToggleBtn = document.getElementById('toc-toggle-btn');
        var tocTitle = document.getElementById('toc-title');
        var tocContent = document.getElementById('toc-content');
        var tocTitleIcon = document.getElementById('toc-title-icon');
        
        if (!tocWrapper || !tocToggleBtn) return;
        
        // 检查本地存储中的状态
        var isCollapsed = localStorage.getItem('toc-collapsed') === 'true';
        
        // 初始化状态 - 只操作 wrapper 的 class
        if (isCollapsed) {
            tocWrapper.classList.add('collapsed');
            tocWrapper.classList.remove('expanded');
        } else {
            tocWrapper.classList.add('expanded');
            tocWrapper.classList.remove('collapsed');
        }
        
        // 点击切换按钮
        tocToggleBtn.addEventListener('click', function() {
            var isNowCollapsed = tocWrapper.classList.contains('expanded');
            
            if (isNowCollapsed) {
                // 收起
                tocWrapper.classList.add('collapsed');
                tocWrapper.classList.remove('expanded');
                localStorage.setItem('toc-collapsed', 'true');
            } else {
                // 展开
                tocWrapper.classList.add('expanded');
                tocWrapper.classList.remove('collapsed');
                localStorage.setItem('toc-collapsed', 'false');
            }
        });
        
        // 点击 toc-title 收起/展开目录内容
        if (tocTitle && tocContent) {
            tocTitle.addEventListener('click', function() {
                var isContentCollapsed = tocContent.classList.contains('collapsed');
                
                if (isContentCollapsed) {
                    // 展开
                    tocContent.classList.remove('collapsed');
                    tocContent.classList.add('expanded');
                    if (tocTitleIcon) {
                        tocTitleIcon.classList.remove('fa-angle-up');
                        tocTitleIcon.classList.add('fa-angle-down');
                    }
                } else {
                    // 收起
                    tocContent.classList.add('collapsed');
                    tocContent.classList.remove('expanded');
                    if (tocTitleIcon) {
                        tocTitleIcon.classList.remove('fa-angle-down');
                        tocTitleIcon.classList.add('fa-angle-up');
                    }
                }
            });
            
            // 初始化状态
            tocContent.classList.add('expanded');
        }
    }
    
    // 立即执行初始化
    initTocToggle();
    
    // 同时提供一个全局函数，供整页模式手动调用
    window.initTocToggle = initTocToggle;
})();
</script>

    <script>
    function hexToRgb(hex) {
      if (!hex) return null;
      hex = hex.replace('#', '');
      let r = parseInt(hex.slice(0, 2), 16);
      let g = parseInt(hex.slice(2, 4), 16);
      let b = parseInt(hex.slice(4, 6), 16);
      return { r, g, b };
    }
    function adjustColor(color, adjustment) {
        if (!color) return null;
      let { r, g, b } = hexToRgb(color);
      r = Math.min(255, Math.max(0, r + adjustment));
      g = Math.min(255, Math.max(0, g + adjustment));
      b = Math.min(255, Math.max(0, b + adjustment));
      return `rgb(${r}, ${g}, ${b})`;
    }
    const BackColors = ['#FFFFFF', '#F0FFF0', '#FFFFF0'];
    let ColorIndex = 0;
    function changeBackgroundColor(newColor) {
        $('.outer, .widget-wrap h3, body, .article-inner, .article-inner .article-meta').css('background-color', newColor);
        $('.article-entry blockquote').css('background-color', adjustColor(newColor, -10)).css('border-left','4px solid #c8c8c8');
    }
    $(document).ready(function() {
        changeBackgroundColor(BackColors[ColorIndex]);
    });
    </script>

<script>
    // anchorInterceptor
    anchorInterceptor = function(path) {
        // 添加 fullpage=1 参数表示整页打开
        const separator = path.includes('?') ? '&' : '?';
        const fullPath = path + separator + 'fullpage=1';
        // change hash to trigger route change
        window.location.hash = fullPath;
    }

    document.addEventListener('DOMContentLoaded', function() {
        var container = document.getElementById('container');
        
        // 检查URL中是否有 fullpage=1 参数
        var urlParams = new URLSearchParams(window.location.search);
        var isFullPage = urlParams.get('fullpage') === '1';
        
        // 如果有 container（完整布局）或者 fullpage=1，执行跳转
        if (container || isFullPage) {
            var path = window.location.pathname;
            var origin = window.location.origin;
            console.log('path:',path, '\norigin:',origin);
            console.log('document:', document);
            // 如果已经在 hash 路由中，不需要跳转
            if (window.location.hash) {
                return;
            }
            // 如果path是根路径，跳转到首页hash
            if (path === '/' || path === '' || path === '/index.html') {
                window.location.href = origin + '#/';
            } else {
                window.location.href = origin + '#' + path;
            }
        }
        // 否则不跳转，需要加载js、css来渲染单页面
    });

    // 切换到单页模式
    switchToSinglePage = function() {
        // 获取当前文章路径（从hash中提取或从pathname）
        var path = window.location.hash ? window.location.hash.slice(1) : window.location.pathname;
        // 移除fullpage参数
        path = path.replace(/[?&]fullpage=1/, '');
        // 在新标签页打开完整URL
        window.open(window.location.origin + path, '_blank');
