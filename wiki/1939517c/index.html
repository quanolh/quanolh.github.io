n> tensorflow <span class="keyword">as</span> tf</span><br><span class="line"><span class="keyword">from</span> tensorflow.keras <span class="keyword">import</span> layers, models</span><br><span class="line"><span class="keyword">from</span> tensorflow.keras.preprocessing.image <span class="keyword">import</span> ImageDataGenerator</span><br><span class="line"><span class="keyword">from</span> sklearn.model_selection <span class="keyword">import</span> train_test_split</span><br><span class="line"><span class="keyword">from</span> sklearn.preprocessing <span class="keyword">import</span> LabelBinarizer</span><br><span class="line"><span class="keyword">import</span> os</span><br><span class="line"><span class="keyword">import</span> numpy <span class="keyword">as</span> np</span><br><span class="line"><span class="keyword">from</span> PIL <span class="keyword">import</span> Image</span><br><span class="line"></span><br><span class="line"><span class="comment"># Define the path to your dataset</span></span><br><span class="line">dataset_path = <span class="string">&#x27;/kaggle/input/freiburg-groceries/images/OIL/&#x27;</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># Load and preprocess your dataset</span></span><br><span class="line">image_paths = [os.path.join(dataset_path, filename) <span class="keyword">for</span> filename <span class="keyword">in</span> os.listdir(dataset_path)]</span><br><span class="line">images = []</span><br><span class="line">labels = []</span><br><span class="line"></span><br><span class="line"><span class="keyword">for</span> image_path <span class="keyword">in</span> image_paths:</span><br><span class="line">    <span class="comment"># Load and resize the image to a common size (e.g., 224x224)</span></span><br><span class="line">    image = Image.<span class="built_in">open</span>(image_path)</span><br><span class="line">    image = image.resize((<span class="number">224</span>, <span class="number">224</span>))</span><br><span class="line">    image = np.array(image) / <span class="number">255.0</span>  <span class="comment"># Normalize pixel values to [0, 1]</span></span><br><span class="line">    images.append(image)</span><br><span class="line">    </span><br><span class="line">    <span class="comment"># Extract the class label from the image path (assuming the path structure)</span></span><br><span class="line">    label = image_path.split(os.path.sep)[-<span class="number">2</span>]  <span class="comment"># Assuming the label is the second-to-last directory</span></span><br><span class="line">    labels.append(label)</span><br><span class="line"></span><br><span class="line"><span class="comment"># Convert labels to one-hot encoded vectors</span></span><br><span class="line">label_binarizer = LabelBinarizer()</span><br><span class="line">labels = label_binarizer.fit_transform(labels)</span><br><span class="line"></span><br><span class="line"><span class="comment"># Split the dataset into training and testing sets</span></span><br><span class="line">X_train, X_test, y_train, y_test = train_test_split(images, labels, test_size=<span class="number">0.2</span>, random_state=<span class="number">42</span>)</span><br><span class="line"></span><br><span class="line"><span class="comment"># Create a simple CNN model</span></span><br><span class="line">model = models.Sequential([</span><br><span class="line">    layers.Conv2D(<span class="number">32</span>, (<span class="number">3</span>, <span class="number">3</span>), activation=<span class="string">&#x27;relu&#x27;</span>, input_shape=(<span class="number">224</span>, <span class="number">224</span>, <span class="number">3</span>)),</span><br><span class="line">    layers.MaxPooling2D((<span class="number">2</span>, <span class="number">2</span>)),</span><br><span class="line">    layers.Conv2D(<span class="number">64</span>, (<span class="number">3</span>, <span class="number">3</span>), activation=<span class="string">&#x27;relu&#x27;</span>),</span><br><span class="line">    layers.MaxPooling2D((<span class="number">2</span>, <span class="number">2</span>)),</span><br><span class="line">    layers.Conv2D(<span class="number">64</span>, (<span class="number">3</span>, <span class="number">3</span>), activation=<span class="string">&#x27;relu&#x27;</span>),</span><br><span class="line">    layers.Flatten(),</span><br><span class="line">    layers.Dense(<span class="number">64</span>, activation=<span class="string">&#x27;relu&#x27;</span>),</span><br><span class="line">    layers.Dense(<span class="built_in">len</span>(label_binarizer.classes_), activation=<span class="string">&#x27;softmax&#x27;</span>)  <span class="comment"># Output layer with the number of classes</span></span><br><span class="line">])</span><br><span class="line"></span><br><span class="line"><span class="comment"># Compile the model</span></span><br><span class="line">model.<span class="built_in">compile</span>(optimizer=<span class="string">&#x27;adam&#x27;</span>,</span><br><span class="line">              loss=<span class="string">&#x27;categorical_crossentropy&#x27;</span>,</span><br><span class="line">              metrics=[<span class="string">&#x27;accuracy&#x27;</span>])</span><br><span class="line"></span><br><span class="line"><span class="comment"># Train the model</span></span><br><span class="line">model.fit(np.array(X_train), np.array(y_train), epochs=<span class="number">10</span>, batch_size=<span class="number">32</span>, validation_split=<span class="number">0.2</span>)</span><br><span class="line"></span><br><span class="line"><span class="comment"># Evaluate the model on the test data</span></span><br><span class="line">test_loss, test_acc = model.evaluate(np.array(X_test), np.array(y_test))</span><br><span class="line"><span class="built_in">print</span>(<span class="string">f&#x27;Test accuracy: <span class="subst">&#123;test_acc&#125;</span>&#x27;</span>)</span><br></pr     <script>
    function hexToRgb(hex) {
      if (!hex) return null;
      hex = hex.replace('#', '');
      let r = parseInt(hex.slice(0, 2), 16);
      let g = parseInt(hex.slice(2, 4), 16);
      let b = parseInt(hex.slice(4, 6), 16);
      return { r, g, b };
    }
    function adjustColor(color, adjustment) {
        if (!color) return null;
      let { r, g, b } = hexToRgb(color);
      r = Math.min(255, Math.max(0, r + adjustment));
      g = Math.min(255, Math.max(0, g + adjustment));
      b = Math.min(255, Math.max(0, b + adjustment));
      return `rgb(${r}, ${g}, ${b})`;
    }
    const BackColors = ['#FFFFFF', '#F0FFF0', '#FFFFF0'];
    let ColorIndex = 0;
    function changeBackgroundColor(newColor) {

    $(document).ready(function() {
        changeBackgroundColor(BackColors[ColorIndex]);
    });
