;</span>/&gt;</span></span><br><span class="line">        <span class="tag">&lt;/<span class="name">module</span>&gt;</span></span><br><span class="line"></span><br><span class="line">        <span class="tag">&lt;<span class="name">module</span> <span class="attr">name</span>=<span class="string">&quot;LocalVariableName&quot;</span>&gt;</span></span><br><span class="line">            <span class="comment">&lt;!-- Validates identifiers for local variables against the</span></span><br><span class="line"><span class="comment">              expression &quot;^[a-z][a-zA-Z0-9]*$&quot;. --&gt;</span></span><br><span class="line">            <span class="tag">&lt;<span class="name">property</span> <span class="attr">name</span>=<span class="string">&quot;severity&quot;</span> <span class="attr">value</span>=<span class="string">&quot;warning&quot;</span>/&gt;</span></span><br><span class="line">        <span class="tag">&lt;/<span class="name">module</span>&gt;</span></span><br><span class="line"></span><br><span class="line"></span><br><span class="line">        <span class="comment">&lt;!--</span></span><br><span class="line"><span class="comment"></span></span><br><span class="line"><span class="comment">        LENGTH and CODING CHECKS</span></span><br><span class="line"><span class="comment"></span></span><br><span class="line"><span class="comment">        --&gt;</span></span><br><span class="line"></span><br><span class="line">        <span class="tag">&lt;<span class="name">module</span> <span class="attr">name</span>=<span class="string">&quot;LineLength&quot;</span>&gt;</span></span><br><span class="line">            <span class="comment">&lt;!-- Checks if a line is too long. --&gt;</span></span><br><span class="line">            <span class="tag">&lt;<span class="name">property</span> <span class="attr">name</span>=<span class="string">&quot;max&quot;</span> <span class="attr">value</span>=<span class="string">&quot;$&#123;com.puppycrawl.tools.checkstyle.checks.sizes.LineLength.max&#125;&quot;</span> <span class="attr">default</span>=<span class="string">&quot;100&quot;</span>/&gt;</span></span><br><span class="line">            <span class="tag">&lt;<span class="name">property</span> <span class="attr">name</span>=<span class="string">&quot;severity&quot;</span> <span class="attr">value</span>=<span class="string">&quot;error&quot;</span>/&gt;</span></span><br><span class="line"></span><br><span class="line">            <span class="comment">&lt;!--</span></span><br><span class="line"><span class="comment">              The default ignore pattern exempts the following elements:</span></span><br><span class="line"><span class="comment">                - import statements</span></span><br><span class="line"><span class="comment">                - long URLs inside comments</span></span><br><span class="line"><span class="comment">            --&gt;</span></span><br><span class="line"></span><br><span class="line">            <span class="tag">&lt;<span class="name">property</span> <span class="attr">name</span>=<span class="string">&quot;ignorePattern&quot;</span></span></span><br><span class="line"><span class="tag">                      <span class="attr">value</span>=<span class="string">&quot;$&#123;com.puppycrawl.tools.checkstyle.checks.sizes.LineLength.ignorePattern&#125;&quot;</span></span></span><br><span class="line"><span class="tag">                      <span class="attr">default</span>=<span class="string">&quot;^(package .*;\s*)|(import .*;\s*)|( *\* *https?://.*)$&quot;</span>/&gt;</span></span><br><span class="line">        <span class="tag">&lt;/<span class="name">module</span>&gt;</span></span><br><span class="line"></span><br><span class="line">        <span class="tag">&lt;<span class="name">module</span> <span class="attr">name</span>=<span class="string">&quot;LeftCurly&quot;</span>&gt;</span></span><br><span class="line">            <span class="comment">&lt;!-- Checks for placement of the left curly brace (&#x27;&#123;&#x27;). --&gt;</span></span><br><span class="line">            <span class="tag">&lt;<span class="name">property</span> <span class="attr">name</span>=<span class="string">&quot;severity&quot;</span> <span class="attr">value</span>=<span class="string">&quot;warning&quot;</span>/&gt;</span></span><br><span class="line">        <span class="tag">&lt;/<span class="name">module</span>&gt;</span></span><br><span class="line"></span><br><span class="line">        <span class="tag">&lt;<span class="name">module</span> <span class="attr">name</span>=<span class="string">&quot;RightCurly&quot;</span>&gt;</span></span><br><span class="line">            <span class="comment">&lt;!-- Checks right curlies on CATCH, ELSE, and TRY blocks are on</span></span><br><span class="line"><span class="comment">            the same line. e.g., the following example is fine:</span></span><br><span class="line"><span class="comment">            &lt;pre&gt;</span></span><br><span class="line"><span class="comment">              if &#123;</span></span><br><span class="line"><span class="comment">                ...</span></span><br><span class="line"><span class="comment">              &#125; else</span></span><br><span class="line"><span class="comment">            &lt;/pre&gt;</span></span><br><span class="line"><span class="comment">            --&gt;</span></span><br><span class="line">            <span class="comment">&lt;!-- This next example is not fine:</span></span><br><span class="line"><span class="comment">            &lt;pre&gt;</span></span><br><span class="line"><span class="comment">              if &#123;</span></span><br><span class="line"><span class="comment">                ...</span></span><br><span class="line"><span class="comment">              &#125;</span></span><br><span class="line"><span class="comment">              else</span></span><br><span class="line"><span class="comment">            &lt;/pre&gt;</span></span><br><span class="line"><span class="comment">            --&gt;</span></span><br><span class="line">            <span class="tag">&lt;<span class="name">property</span> <span class="attr">name</span>=<span class="string">&quot;option&quot;</span> <span class="attr">value</span>=<span class="string">&quot;same&quot;</span>/&gt;</span></span><br><span class="line">            <span class="tag">&lt;<span class="name">property</span> <span class="attr">name</span>=<span class="string">&quot;severity&quot;</span> <span class="attr">value</span>=<span class="string">&quot;warning&quot;</span>/&gt;</span></span><br><span class="line">        <span class="tag">&lt;/<span class="name">module</span>&gt;</span></span><br><span class="line"></span><br><span class="line">        <span class="comment">&lt;!-- Checks for braces around if and else blocks --&gt;</span></span><br><span class="line">        <span class="tag">&lt;<span class="name">module</span> <span class="attr">name</span>=<span class="string">&quot;NeedBraces&quot;</span>&gt;</span></span><br><span class="line">            <span class="tag">&lt;<span class="name">property</span> <span class="attr">name</span>=<span class="string">&quot;severity&quot;</span> <span class="attr">value</span>=<span class="string">&quot;warning&quot;</span>/&gt;</span></span><br><span class="line">            <span class="tag">&lt;<span class="name">property</span> <span class="attr">name</span>=<span class="string">&quot;tokens&quot;</span> <span class="attr">value</span>=<span class="string">&quot;LITERAL_IF, LITERAL_ELSE, LITERAL_FOR, LITERAL_WHILE, LITERAL_DO&quot;</span>/&gt;</span></span><br><span class="line">        <span class="tag">&lt;/<span class="name">module</span>&gt;</span></span><br><span class="line"></span><br><span class="line">        <span class="tag">&lt;<span class="name">module</span> <span class="attr">name</span>=<span class="string">&quot;UpperEll&quot;</span>&gt;</span></span><br><span class="line">            <span class="comment">&lt;!-- Checks that long constants are defined with an upper ell.--&gt;</span></span><br><span class="line">            <span class="tag">&lt;<span class="name">property</span> <span class="attr">name</span>=<span class="string">&quot;severity&quot;</span> <span class="attr">value</span>=<span class="string">&quot;error&quot;</span>/&gt;</span></span><br><span class="line">        <span class="tag">&lt;/<span class="name">module</span>&gt;</span></span><br><span class="line"></span><br><span class="line">        <span class="tag">&lt;<span class="name">module</span> <span class="attr">name</span>=<span class="string">&quot;FallThrough&quot;</span>&gt;</span></span><br><span class="line">            <span class="comment">&lt;!-- Warn about falling through to the next case statement.  Similar to</span></span><br><span class="line"><span class="comment">            javac -Xlint:fallthrough, but the check is suppressed if a single-line comment</span></span><br><span class="line"><span class="comment">            on the last non-blank line preceding the fallen-into case contains &#x27;fall through&#x27; (or</span></span><br><span class="line"><span class="comment">            some other variants which we don&#x27;t publicized to promote consistency).</span></span><br><span class="line"><span class="comment">            --&gt;</span></span><br><span class="line">            <span class="tag">&lt;<span class="name">property</span> <span class="attr">name</span>=<span class="string">&quot;reliefPattern&quot;</span></span></span><br><span class="line"><span class="tag">                      <span class="attr">value</span>=<span class="string">&quot;fall through|Fall through|fallthru|Fallthru|falls through|Falls through|fallthrough|Fallthrough|No break|NO break|no break|continue on&quot;</span>/&gt;</span></span><br><span class="line">            <span class="tag">&lt;<span class="name">property</span> <span class="attr">name</span>=<span class="string">&quot;severity&quot;</span> <span class="attr">value</span>=<span class="string">&quot;error&quot;</span>/&gt;</span></span><br><span class="line">        <span class="tag">&lt;/<span class="name">module</span>&gt;</span></span><br><span class="line"></span><br><span class="line"></span><br><span class="line">        <span class="comment">&lt;!--</span></span><br><span class="line"><span class="comment"></span></span><br><span class="line"><span class="comment">        MODIFIERS CHECKS</span></span><br><span class="line"><span class="comment"></span></span><br><span class="line"><span class="comment">        --&gt;</span></span><br><span class="line"></span><br><span class="line">        <span class="tag">&lt;<span class="name">module</span> <span class="attr">name</span>=<span class="string">&quot;ModifierOrder&quot;</span>&gt;</span></span><br><span class="line">            <span class="comment">&lt;!-- Warn if modifier order is inconsistent with JLS3 8.1.1, 8.3.1, and</span></span><br><span class="line"><span class="comment">                 8.4.3.  The prescribed order is:</span></span><br><span class="line"><span class="comment">                 public, protected, private, abstract, static, final, transient, volatile,</span></span><br><span class="line"><span class="comment">                 synchronized, native, strictfp</span></span><br><span class="line"><span class="comment">              --&gt;</span></span><br><span class="line">        <span class="tag">&lt;/<span class="name">module</span>&gt;</span></span><br><span class="line"></span><br><span class="line"></span><br><span class="line">        <span class="comment">&lt;!--</span></span><br><span class="line"><span class="comment"></span></span><br><span class="line"><span class="comment">        WHITESPACE CHECKS</span></span><br><span class="line"><span class="comment"></span></span><br><span class="line"><span class="comment">        --&gt;</span></span><br><span class="line"></span><br><span class="line">        <span class="tag">&lt;<span class="name">module</span> <span class="attr">name</span>=<span class="string">&quot;WhitespaceAround&quot;</span>&gt;</span></span><br><span class="line">            <span class="comment">&lt;!-- Checks that various tokens are surrounded by whitespace.</span></span><br><span class="line"><span class="comment">                 This includes most binary operators and keywords followed</span></span><br><span class="line"><span class="comment">                 by regular or curly braces.</span></span><br><span class="line"><span class="comment">            --&gt;</span></span><br><span class="line">            <span class="tag">&lt;<span class="name">property</span> <span class="attr">name</span>=<span class="string">&quot;tokens&quot;</span> <span class="attr">value</span>=<span class="string">&quot;ASSIGN, BAND, BAND_ASSIGN, BOR,</span></span></span><br><span class="line"><span class="string"><span class="tag">        BOR_ASSIGN, BSR, BSR_ASSIGN, BXOR, BXOR_ASSIGN, COLON, DIV, DIV_ASSIGN,</span></span></span><br><span class="line"><span class="string"><span class="tag">        EQUAL, GE, GT, LAND, LE, LITERAL_CATCH, LITERAL_DO, LITERAL_ELSE,</span></span></span><br><span class="line"><span class="string"><span class="tag">        LITERAL_FINALLY, LITERAL_FOR, LITERAL_IF, LITERAL_RETURN,</span></span></span><br><span class="line"><span class="string"><span class="tag">        LITERAL_SYNCHRONIZED, LITERAL_TRY, LITERAL_WHILE, LOR, LT, MINUS,</span></span></span><br><span class="line"><span class="string"><span class="tag">        MINUS_ASSIGN, MOD, MOD_ASSIGN, NOT_EQUAL, PLUS, PLUS_ASSIGN, QUESTION,</span></span></span><br><span class="line"><span class="string"><span class="tag">        SL, SL_ASSIGN, SR_ASSIGN, STAR, STAR_ASSIGN&quot;</span>/&gt;</span></span><br><span class="line">            <span class="tag">&lt;<span class="name">property</span> <span class="attr">name</span>=<span class="string">&quot;severity&quot;</span> <span class="attr">value</span>=<span class="string">&quot;error&quot;</span>/&gt;</span></span><br><span class="line">        <span class="tag">&lt;/<span class="name">module</span>&gt;</span></span><br><span class="line"></span><br><span class="line">        <span class="tag">&lt;<span class="name">module</span> <span class="attr">name</span>=<span class="string">&quot;WhitespaceAfter&quot;</span>&gt;</span></span><br><span class="line">            <span class="comment">&lt;!-- Checks that commas, semicolons and typecasts are followed by</span></span><br><span class="line"><span class="comment">                 whitespace.</span></span><br><span class="line"><span class="comment">            --&gt;</span></span><br><span class="line">            <span class="tag">&lt;<span class="name">property</span> <span class="attr">name</span>=<span class="string">&quot;tokens&quot;</span> <span class="attr">value</span>=<span class="string">&quot;COMMA, SEMI, TYPECAST&quot;</span>/&gt;</span></span><br><span class="line">        <span class="tag">&lt;/<span class="name">module</span>&gt;</span></span><br><span class="line"></span><br><span class="line">        <span class="tag">&lt;<span class="name">module</span> <span class="attr">name</span>=<span class="string">&quot;NoWhitespaceAfter&quot;</span>&gt;</span></span><br><span class="line">            <span class="comment">&lt;!-- Checks that there is no whitespace after various unary operators.</span></span><br><span class="line"><span class="comment">                 Linebreaks are allowed.</span></span><br><span class="line"><span class="comment">            --&gt;</span></span><br><span class="line">            <span class="tag">&lt;<span class="name">property</span> <span class="attr">name</span>=<span class="string">&quot;tokens&quot;</span> <span class="attr">value</span>=<span class="string">&quot;BNOT, DEC, DOT, INC, LNOT, UNARY_MINUS,</span></span></span><br><span class="line"><span class="string"><span class="tag">        UNARY_PLUS&quot;</span>/&gt;</span></span><br><span class="line">            <span class="tag">&lt;<span class="name">property</span> <span class="attr">name</span>=<span class="string">&quot;allowLineBreaks&quot;</span> <span class="attr">value</span>=<span class="string">&quot;true&quot;</span>/&gt;</span></span><br><span class="line">            <span class="tag">&lt;<span class="name">property</span> <span class="attr">name</span>=<span class="string">&quot;severity&quot;</span> <span class="attr">value</span>=<span class="string">&quot;error&quot;</span>/&gt;</span></span><br><span class="line">        <span class="tag">&lt;/<span class="name">module</span>&gt;</span></span><br><span class="line"></span><br><span class="line">        <span class="tag">&lt;<span class="name">module</span> <span class="attr">name</span>=<span class="string">&quot;NoWhitespaceBefore&quot;</span>&gt;</span></span><br><span class="line">            <span class="comment">&lt;!-- Checks that there is no whitespace before various unary operators.</span></span><br><span class="line"><span class="comment">                 Linebreaks are allowed.</span></span><br><span class="line"><span class="comment">            --&gt;</span></span><br><span class="line">            <span class="tag">&lt;<span class="name">property</span> <span class="attr">name</span>=<span class="string">&quot;tokens&quot;</span> <span class="attr">value</span>=<span class="string">&quot;SEMI, DOT, POST_DEC, POST_INC&quot;</span>/&gt;</span></span><br><span class="line">            <span class="tag">&lt;<span class="name">property</span> <span class="attr">name</span>=<span class="string">&quot;allowLineBreaks&quot;</span> <span class="attr">value</span>=<span class="string">&quot;true&quot;</span>/&gt;</span></span><br><span class="line">            <span class="tag">&lt;<span class="name">property</span> <span class="attr">name</span>=<span class="string">&quot;severity&quot;</span> <span class="attr">value</span>=<span class="string">&quot;error&quot;</span>/&gt;</span></span><br><span class="line">        <span class="tag">&lt;/<span class="name">module</span>&gt;</span></span><br><span class="line"></span><br><span class="line">        <span class="tag">&lt;<span class="name">module</span> <span class="attr">name</span>=<span class="string">&quot;ParenPad&quot;</span>&gt;</span></span><br><span class="line">            <span class="comment">&lt;!-- Checks that there is no whitespace before close parens or after</span></span><br><span class="line"><span class="comment">                 open parens.</span></span><br><span class="line"><span class="comment">            --&gt;</span></span><br><span class="line">            <span class="tag">&lt;<span class="name">property</span> <span class="attr">name</span>=<span class="string">&quot;severity&quot;</span> <span class="attr">value</span>=<span class="string">&quot;warning&quot;</span>/&gt;</span></span><br><span class="line">        <span class="tag">&lt;/<span class="name">module</span>&gt;</span></span><br><span class="line"></span><br><span class="line">    <span class="tag">&lt;/<span class="name">module</span>&gt;</span></span><br><span class="line"><span class="tag">&lt;/<span class="name">module</span>&gt;</span></span><br><span class="line"></span><br></pre></td></tr></table></figure>

<!-- TOC 收起/展开功能 -->
<script data-pjax>
(function() {
    // 初始化 TOC 切换功能的函数
    function initTocToggle() {
        var tocWrapper = document.getElementById('toc-wrapper');
        var tocToggleBtn = document.getElementById('toc-toggle-btn');
        var tocTitle = document.getElementById('toc-title');
        var tocContent = document.getElementById('toc-content');
        var tocTitleIcon = document.getElementById('toc-title-icon');
        
        if (!tocWrapper || !tocToggleBtn) return;
        
        // 检查本地存储中的状态
        var isCollapsed = localStorage.getItem('toc-collapsed') === 'true';
        
        // 初始化状态 - 只操作 wrapper 的 class
        if (isCollapsed) {
            tocWrapper.classList.add('collapsed');
            tocWrapper.classList.remove('expanded');
        } else {
            tocWrapper.classList.add('expanded');
            tocWrapper.classList.remove('collapsed');
        }
        
        // 点击切换按钮
        tocToggleBtn.addEventListener('click', function() {
            var isNowCollapsed = tocWrapper.classList.contains('expanded');
            
            if (isNowCollapsed) {
                // 收起
                tocWrapper.classList.add('collapsed');
                tocWrapper.classList.remove('expanded');
                localStorage.setItem('toc-collapsed', 'true');
            } else {
                // 展开
                tocWrapper.classList.add('expanded');
                tocWrapper.classList.remove('collapsed');
                localStorage.setItem('toc-collapsed', 'false');
            }
        });
        
        // 点击 toc-title 收起/展开目录内容
        if (tocTitle && tocContent) {
            tocTitle.addEventListener('click', function() {
                var isContentCollapsed = tocContent.classList.contains('collapsed');
                
                if (isContentCollapsed) {
                    // 展开
                    tocContent.classList.remove('collapsed');
                    tocContent.classList.add('expanded');
                    if (tocTitleIcon) {
                        tocTitleIcon.classList.remove('fa-angle-up');
                        tocTitleIcon.classList.add('fa-angle-down');
                    }
                } else {
                    // 收起
                    tocContent.classList.add('collapsed');
                    tocContent.classList.remove('expanded');
                    if (tocTitleIcon) {
                        tocTitleIcon.classList.remove('fa-angle-down');
                        tocTitleIcon.classList.add('fa-angle-up');
                    }
                }
            });
            
            // 初始化状态
            tocContent.classList.add('expanded');
        }
    }
    
    // 立即执行初始化
    initTocToggle();
    
    // 同时提供一个全局函数，供整页模式手动调用
    window.initTocToggle = initTocToggle;
})();
</script>

    <script>
    function hexToRgb(hex) {
      if (!hex) return null;
      hex = hex.replace('#', '');
      let r = parseInt(hex.slice(0, 2), 16);
      let g = parseInt(hex.slice(2, 4), 16);
      let b = parseInt(hex.slice(4, 6), 16);
      return { r, g, b };
    }
    function adjustColor(color, adjustment) {
        if (!color) return null;
      let { r, g, b } = hexToRgb(color);
      r = Math.min(255, Math.max(0, r + adjustment));
      g = Math.min(255, Math.max(0, g + adjustment));
      b = Math.min(255, Math.max(0, b + adjustment));
      return `rgb(${r}, ${g}, ${b})`;
    }
    const BackColors = ['#FFFFFF', '#F0FFF0', '#FFFFF0'];
    let ColorIndex = 0;
    function changeBackgroundColor(newColor) {
        $('.outer, .widget-wrap h3, body, .article-inner, .article-inner .article-meta').css('background-color', newColor);
        $('.article-entry blockquote').css('background-color', adjustColor(newColor, -10)).css('border-left','4px solid #c8c8c8');
    }
    $(document).ready(function() {
        changeBackgroundColor(BackColors[ColorIndex]);
    });
    </script>

<script>
    // anchorInterceptor
    anchorInterceptor = function(path) {
        // 添加 fullpage=1 参数表示整页打开
        const separator = path.includes('?') ? '&' : '?';
        const fullPath = path + separator + 'fullpage=1';
        // change hash to trigger route change
        window.location.hash = fullPath;
    }

    document.addEventListener('DOMContentLoaded', function() {
        var container = document.getElementById('container');
        
        // 检查URL中是否有 fullpage=1 参数
        var urlParams = new URLSearchParams(window.location.search);
        var isFullPage = urlParams.get('fullpage') === '1';
        
        // 如果有 container（完整布局）或者 fullpage=1，执行跳转
        if (container || isFullPage) {
            var path = window.location.pathname;
            var origin = window.location.origin;
            console.log('path:',path, '\norigin:',origin);
            console.log('document:', document);
            // 如果已经在 hash 路由中，不需要跳转
            if (window.location.hash) {
                return;
            }
            // 如果path是根路径，跳转到首页hash
            if (path === '/' || path === '' || path === '/index.html') {
                window.location.href = origin + '#/';
            } else {
                window.location.href = origin + '#' + path;
            }
        }
        // 否则不跳转，需要加载js、css来渲染单页面
    });

    // 切换到单页模式
    switchToSinglePage = function() {
        // 获取当前文章路径（从hash中提取或从pathname）
        var path = window.location.hash ? window.location.hash.slice(1) : window.location.pathname;
        // 移除fullpage参数
        path = path.replace(/[?&]fullpage=1/, '');
        // 在新标签页打开完整URL
        window.open(window.location.origin + path, '_blank');
    }

    $(document).ready(function() {
        if ($('#toggle-sidebar-btn').hasClass('fa-angle-right')) {
            $('.page-indent').toggleClass('collapsed');
            $('.article-meta').toggleClass('collapsed');
            $('.article-more-link').toggleClass('collapsed');
        }
        const colorIndex = localStorage.getItem("ColorIndex");
        // init color
        changeBackgroundColor(BackColors[colorIndex]);
    });

    anchorComponentOnclick = function(event) {
        // 文章的头链接 | 点击监听
        $('.article-category-link').on('click', function(event) {
            event.preventDefault();
            const path = $(this).attr('href');
            anchorInterceptor(path);
        });
        // 目录的跳转 | 点击监听
        $('.toc-link').on('click', function(event) {
            event.preventDefault();
            const params = new URLSearchParams(window.location.search);
            //const sectionId = $(this).attr('href').replace('?section=', '');
            // 更新 URL，但不刷新页面
            const idx = decodeURIComponent($(this).attr('href')).slice(1);
            if (idx != 'ndefined') {
                params.set('section', idx);
                const curPath = window.location.pathname + window.location.hash.split('?section=')[0];
                const newUrl = curPath + '?' + params.toString();
                window.history.pushState({}, '', newUrl);
                // 滚动到对应位置
                scrollToSection(idx);
            }
        });
        $('.tag-link-link').on('click', function(event) {
            event.preventDefault();
            const path = $(this).attr('href');
            anchorInterceptor(path);
        });
        $('#page-nav').on('click', 'a', function(event) {
            event.preventDefault();
            const path = $(this).attr('href');
            anchorInterceptor(path);
        });
    }
</script>
